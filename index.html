<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swaranjali Patil – Music Educator &amp; Vocalist</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--soft:#f3f5f9;--ink:#14213d;--mute:#3b475e;--acc:#85600f;--line:#dde2ec;--navy:#14213d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1729;--soft:#18223b;--ink:#eef1f7;--mute:#a9b3c9;--acc:#d4ab55;--line:#2a3654;--navy:#0a1020;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1729;--soft:#18223b;--ink:#eef1f7;--mute:#a9b3c9;--acc:#d4ab55;--line:#2a3654;--navy:#0a1020;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:4.5rem}
body{background:var(--bg);color:var(--ink);font:400 1.06rem/1.7 Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;line-height:1.1}
a{color:inherit}
.wrap{max-width:66rem;margin:auto;padding:0 1.4rem}
nav{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;height:3.6rem}
nav b{font:700 1.35rem "Cormorant Garamond",serif}
nav ul{display:flex;gap:1.4rem;list-style:none;padding:0;font-size:.95rem}
nav a{text-decoration:none;color:var(--mute);transition:color .2s}
nav a:hover{color:var(--acc)}
@media(max-width:640px){nav ul{display:none}}
.hero{padding:4.5rem 0 3.5rem}
.hero .wrap{display:grid;gap:3rem;align-items:center}
@media(min-width:800px){.hero .wrap{grid-template-columns:1.5fr 1fr}}
.role{color:var(--acc);font-weight:600;margin-bottom:.8rem}
h1{font-size:clamp(3rem,9vw,5.4rem);margin-bottom:1.2rem}
.lead{color:var(--mute);max-width:34rem;font-size:1.15rem}
.cta{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:2rem}
.btn{padding:.75rem 1.5rem;border-radius:.3rem;text-decoration:none;font-weight:600;border:1.5px solid var(--navy);transition:.25s}
.btn.f{background:var(--navy);color:#fff}
.btn:hover{transform:translateY(-2px);border-color:var(--acc)}
.mono{aspect-ratio:4/5;max-width:20rem;width:100%;margin:auto;border-radius:.4rem;background:var(--navy);color:#fff;display:grid;place-items:center;position:relative;overflow:hidden}
.mono span{font:600 5.5rem "Cormorant Garamond",serif;color:var(--acc);position:relative}
.mono svg{position:absolute;left:0;bottom:12%;width:100%;height:30%}
.mono path{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;stroke-dasharray:6 8;animation:flow 14s linear infinite}
.mono path:nth-child(2){opacity:.3;animation-duration:22s;animation-direction:reverse}
@keyframes flow{to{stroke-dashoffset:-280}}
